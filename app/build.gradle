plugins {
    id 'com.android.application'
}

// Set by the GitHub build. Local builds fall back to the debug key and version 1.
def keystorePath = System.getenv('ALLMETAR_KEYSTORE')
def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer

android {
    namespace 'io.github.esesemdi.allmetar'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.esesemdi.allmetar'
        minSdk 26
        targetSdk 35
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
    }

    signingConfigs {
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storeType 'pkcs12'
                // Not secret: the keystore file itself is what is kept private.
                storePassword 'allmetar'
                keyAlias 'allmetar'
                keyPassword 'allmetar'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystorePath ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    testOptions {
        unitTests.all {
            testLogging {
                events 'passed', 'failed', 'skipped'
                exceptionFormat 'full'
            }
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
